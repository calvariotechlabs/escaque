# Integración continua: tipos, tests, perft completo y montaje del sitio.
# Sin secretos ni despliegue: publicar lo hace Vercel desde el repositorio.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tipos, tests y sitio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (tsc strict)
        run: npm run typecheck
      - name: Tests (node --test)
        run: npm test
      - name: Cobertura (sin las pruebas de reloj real)
        run: npm run test:cobertura
      - name: Montar el sitio (lo que publica Vercel)
        run: npm run build:site
      - name: Cifras del README al día (docs/metricas.json)
        run: npm run metrics:check

  rendimiento:
    name: Rendimiento (reloj real)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas de rendimiento (sin cobertura, una a una)
        run: npm run test:perf

  perft:
    name: Perft a profundidad completa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Perft de referencia (unos 43 millones de nodos)
        run: npm run test:perft

  accesibilidad:
    name: Accesibilidad de extremo a extremo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Teclado, ARIA y SAN en Chrome real (sin dependencias, con tools/cdp.mjs)
        run: npm run test:e2e

  dependencias:
    name: Cero dependencias en ejecución
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Comprobar que `dependencies` está vacío
        run: |
          node -e "
            const p = JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'));
            const n = Object.keys(p.dependencies ?? {});
            if (n.length) { console.error('Dependencias en ejecución:', n.join(', ')); process.exit(1); }
            console.log('dependencies: vacío; devDependencies:', Object.keys(p.devDependencies ?? {}).join(', '));
          "
