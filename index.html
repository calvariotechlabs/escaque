<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>Escaque · tablero</title>
<link rel="stylesheet" href="src/ui/tokens.css">
<link rel="stylesheet" href="src/ui/board.css">
<link rel="stylesheet" href="src/ui/page.css">
<script type="module" src="dist/src/ui/main.js"></script>
</head>
<body>
<header class="pagina__cabecera">
  <h1>Escaque</h1>
  <p>Tablero estático. Todavía no se puede jugar.</p>
</header>
<main class="pagina__principal">
  <section class="pagina__tablero" aria-label="Tablero">
    <div id="tablero"></div>
  </section>
  <section class="pagina__panel" aria-label="Posición">
    <p id="estado" class="pagina__estado" role="status">Cargando el tablero. Si este mensaje no desaparece, ejecuta «npm run serve».</p>
    <div class="campo">
      <label for="posicion">Posición</label>
      <select id="posicion"></select>
    </div>
    <label class="casilla-check"><input type="checkbox" id="marcas" checked> Ver marcas de ejemplo</label>
    <button id="girar" class="boton" type="button">Girar tablero</button>
  </section>
</main>
</body>
</html>
