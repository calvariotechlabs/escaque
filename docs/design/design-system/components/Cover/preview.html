.cover{position:relative;width:960px;height:288px;background:var(--surface);overflow:hidden}
.cover svg{position:absolute;left:0;top:0}
.t0{fill:var(--square-light)}.t1{fill:var(--square-dark)}.b-ink{fill:var(--board-ink)}.b-acc{fill:var(--accent)}.b-sel{fill:var(--mark-selected)}
.cover__texto{position:absolute;left:32px;bottom:32px;width:400px}
.cover h1{margin:0;font:600 96px/.92 var(--font-display);color:var(--ink);letter-spacing:-.01em}
.cover p{margin:12px 0 0;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
</style>
