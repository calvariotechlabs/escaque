<script>
EscaquePieces.mount();
document.getElementById('o').innerHTML=['q','r','b','n'].map(function(t){var n=EscaquePieces.name('w',t).split(' ')[0];return '<button class="coronacion__opcion" type="button">'+EscaquePieces.svg('w',t)+'<span>'+n.charAt(0).toUpperCase()+n.slice(1)+'</span></button>';}).join('');
