<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajustes de partida: dos jugadores</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/escaque/tokens.css">
<link rel="stylesheet" href="ds/escaque/components/bundle.css">
<link rel="stylesheet" href="lecciones.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; min-height: 480px; box-sizing: border-box; padding: 16px; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font: 600 24px/28px var(--font-display)">Escaque</h1>
<nav class="lecc-nav" aria-label="Principal"><a class="lecc-enlace" href="#" aria-current="page">Jugar</a><a class="lecc-enlace" href="#">Lecciones</a></nav>
</header>
<main style="display: flex; flex-direction: column; gap: 16px">
<h2 id="th" style="margin: 0; font: 600 24px/32px var(--font-display)">Nueva partida</h2>
<form class="ajustes">
<fieldset class="grupo">
<legend class="grupo__leyenda">Modo</legend>
<div class="opciones">
<div class="opcion"><input class="opcion__entrada" type="radio" name="modo" id="modo-dos" value="dos" checked><label class="opcion__tarjeta" for="modo-dos"><span class="opcion__nombre">Dos jugadores</span><span class="opcion__texto">Se juega en este dispositivo.</span></label></div>
<div class="opcion"><input class="opcion__entrada" type="radio" name="modo" id="modo-maquina" value="maquina"><label class="opcion__tarjeta" for="modo-maquina"><span class="opcion__nombre">Contra la máquina</span><span class="opcion__texto">Juegas contra Alfil Beta, el motor de Escaque.</span></label></div>
</div>
</fieldset>
<div class="ajustes__acciones">
<button class="boton boton--principal" type="submit">Empezar partida</button>
</div>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
