<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Confirmar nueva partida</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/escaque/tokens.css">
<link rel="stylesheet" href="ds/escaque/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@600&display=swap">
<style>
body{margin:0}
.casilla img{position:relative;z-index:1;display:block;width:100%;height:100%}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 1010px; background: var(--surface); color: var(--ink); font-family: var(--font-sans)">
<div style="box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font: 600 24px/28px var(--font-display)">Escaque</h1>
<p style="margin: 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted)">Dos jugadores</p>
</header>
<p class="estado" role="status" style="margin: 0"><span class="estado__turno estado__turno--w" aria-hidden="true"></span><span><strong>Juegan las blancas.</strong></span></p>
<section aria-label="Tablero">
<div class="tablero">
<div class="tablero__rejilla" role="grid" aria-label="Tablero de ajedrez, visto desde las blancas">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div class="tablero__fila" role="row">
<sc-for list="{{r.row}}" as="c" hint-placeholder-count="8">
<div class="{{c.cls}}" role="gridcell" data-square="{{c.n}}" data-marks="{{c.marks}}" aria-label="{{c.label}}"><sc-if value="{{c.has}}" hint-placeholder-val="{{ true }}"><img src="{{c.img}}" alt=""></sc-if></div>
</sc-for>
</div>
</sc-for>
</div>
<div class="tablero__rangos" aria-hidden="true"><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
<div class="tablero__columnas" aria-hidden="true"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
</div>
</section>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button class="boton boton--principal" type="button" style="grid-column: 1 / -1">Nueva partida</button>
<button class="boton" type="button">Deshacer jugada</button>
<button class="boton" type="button" disabled>Rehacer jugada</button>
<button class="boton" type="button" style="grid-column: 1 / -1">Girar tablero</button>
</div>
<section class="jugadas" aria-labelledby="tj">
<h2 class="jugadas__titulo" id="tj">Jugadas</h2>
<ol class="jugadas__lista" aria-label="Lista de jugadas">
<li><span class="jugadas__n">1.</span><button class="jugada" type="button">e4</button><button class="jugada" type="button">e5</button></li>
<li><span class="jugadas__n">2.</span><button class="jugada" type="button">Cf3</button><button class="jugada" type="button">Cc6</button></li>
<li><span class="jugadas__n">3.</span><button class="jugada" type="button">Ac4</button><button class="jugada" type="button" aria-current="true">Ac5</button></li>
</ol>
</section>
</div>
<div style="position: absolute; inset: 0; z-index: 10; background: color-mix(in srgb, var(--ink) 55%, transparent); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<div role="alertdialog" aria-modal="true" aria-labelledby="cn" aria-describedby="cd" style="box-sizing: border-box; width: 100%; max-width: 340px; background: var(--surface-raised); border: 1px solid var(--control-border); border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 id="cn" style="margin: 0; font: 600 20px/28px var(--font-display)">¿Empezar una partida nueva?</h2>
<p id="cd" style="margin: 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted)">Se perderán las 6 jugadas de esta partida.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<button class="boton" type="button">Seguir jugando</button>
<button class="boton boton--principal" type="button">Empezar</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1010}}'>
class Component extends DCLogic {
  renderVals() {
    const IMG = { wk: '/_blob/f755b0e3cde224439141427c2f79dfcc', wq: '/_blob/e6db5db3ffcd79a147b06454e873bbb6', wr: '/_blob/ccca3b7fa33574992239568f87fea94a', wb: '/_blob/77d6825cc2acba00edb2116763773dbd', wn: '/_blob/8c627fe6f9b20e3c70f41a0d92653372', wp: '/_blob/751ba29078e9e60b8b5d0d7948fd281f', bk: '/_blob/77c898d2513e9ba83ab5680730d01bda', bq: '/_blob/5d4b4d17f82632fdf302ea2f666c3b78', br: '/_blob/2958949152b961dd0b29733063618976', bb: '/_blob/582ab6e66656de76eb46628bace09a68', bn: '/_blob/b85f02c56127bec2806870270b615310', bp: '/_blob/e571c7681346433a14159cb146cfb58c' };
    const NAME = { p: 'peón', n: 'caballo', b: 'alfil', r: 'torre', q: 'dama', k: 'rey' };
    const MARKS = { f3: 'selected', d4: 'target', g5: 'target', h4: 'target', g1: 'target', e5: 'capture', f8: 'last-move', c5: 'last-move' };
    const FEN = 'r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R'.split('/');
    const FILES = 'abcdefgh';
    const rows = FEN.map((text, r) => {
      const line = [];
      for (const ch of text) {
        if (ch >= '1' && ch <= '8') { for (let k = 0; k < Number(ch); k++) line.push(null); } else line.push(ch);
      }
      const rank = 8 - r;
      return { row: line.map((p, c) => {
        const n = FILES[c] + rank;
        const side = p && p === p.toLowerCase() ? 'b' : 'w';
        const t = p ? p.toLowerCase() : '';
        const nombre = p ? NAME[t] + ' ' + (side === 'w' ? 'blanc' : 'negr') + (t === 'r' || t === 'q' ? 'a' : 'o') : 'vacía';
        return { n, cls: 'casilla casilla--' + ((c + rank - 1) % 2 === 1 ? 'clara' : 'oscura'), marks: MARKS[n] || '', has: !!p, img: p ? IMG[side + t] : '', label: n + ', ' + nombre };
      }) };
    });
    return { rows };
  }
}
</script>
</body>
</html>
