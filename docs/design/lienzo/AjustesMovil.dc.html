<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajustes de partida en móvil</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/escaque/tokens.css">
<link rel="stylesheet" href="ds/escaque/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; min-height: 1020px; box-sizing: border-box; padding: 16px; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font: 600 24px/28px var(--font-display)">Escaque</h1>
<p style="margin: 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted)">Aprende ajedrez jugando</p>
</header>
<main style="display: flex; flex-direction: column; gap: 16px">
<h2 id="th" style="margin: 0; font: 600 24px/32px var(--font-display)">Nueva partida</h2>
<form class="ajustes">
<fieldset class="grupo">
<legend class="grupo__leyenda">Modo</legend>
<div class="opciones">
<div class="opcion"><input class="opcion__entrada" type="radio" name="modo" id="modo-dos" value="dos"><label class="opcion__tarjeta" for="modo-dos"><span class="opcion__nombre">Dos jugadores</span><span class="opcion__texto">Se juega en este dispositivo.</span></label></div>
<div class="opcion"><input class="opcion__entrada" type="radio" name="modo" id="modo-maquina" value="maquina" checked><label class="opcion__tarjeta" for="modo-maquina"><span class="opcion__nombre">Contra la máquina</span><span class="opcion__texto">Juegas contra Alfil Beta, el motor de Escaque.</span></label></div>
</div>
</fieldset>
<fieldset class="grupo">
<legend class="grupo__leyenda">Nivel</legend>
<div class="opciones">
<div class="opcion"><input class="opcion__entrada" type="radio" name="nivel" id="nivel-facil" value="facil" checked><label class="opcion__tarjeta" for="nivel-facil"><span class="opcion__nombre">Fácil</span><span class="opcion__texto">Elige jugadas con algo de azar. Para empezar.</span></label></div>
<div class="opcion"><input class="opcion__entrada" type="radio" name="nivel" id="nivel-medio" value="medio"><label class="opcion__tarjeta" for="nivel-medio"><span class="opcion__nombre">Medio</span><span class="opcion__texto">Mira unas jugadas por delante y responde en menos de medio segundo.</span></label></div>
<div class="opcion"><input class="opcion__entrada" type="radio" name="nivel" id="nivel-dificil" value="dificil"><label class="opcion__tarjeta" for="nivel-dificil"><span class="opcion__nombre">Difícil</span><span class="opcion__texto">Piensa cerca de un segundo y cuida sus piezas.</span></label></div>
</div>
</fieldset>
<fieldset class="grupo">
<legend class="grupo__leyenda">Tu color</legend>
<div class="opciones">
<div class="opcion"><input class="opcion__entrada" type="radio" name="color" id="color-blancas" value="blancas"><label class="opcion__tarjeta" for="color-blancas"><span class="opcion__nombre"><span class="estado__turno estado__turno--w" aria-hidden="true"></span>Blancas</span><span class="opcion__texto">Mueves primero.</span></label></div>
<div class="opcion"><input class="opcion__entrada" type="radio" name="color" id="color-negras" value="negras"><label class="opcion__tarjeta" for="color-negras"><span class="opcion__nombre"><span class="estado__turno estado__turno--b" aria-hidden="true"></span>Negras</span><span class="opcion__texto">Mueve primero la máquina.</span></label></div>
<div class="opcion"><input class="opcion__entrada" type="radio" name="color" id="color-azar" value="azar" checked><label class="opcion__tarjeta" for="color-azar"><span class="opcion__nombre"><span class="estado__turno estado__turno--azar" aria-hidden="true"></span>Al azar</span><span class="opcion__texto">Se decide al empezar.</span></label></div>
</div>
</fieldset>
<div class="ajustes__acciones">
<button class="boton boton--principal" type="submit">Empezar partida</button>
</div>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1020}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
