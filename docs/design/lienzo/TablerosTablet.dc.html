<style>
body{margin:0}
.t-bosque{--square-light:#e8efd9;--square-dark:#4a7a58;--board-ink:#0a2418;--mark-last-move:#e3ec7a;--mark-selected:#f2b632}
.t-nogal{--square-light:#f1dfbf;--square-dark:#a2693d;--board-ink:#2b1608;--mark-last-move:#f6e58a;--mark-selected:#5fb7e5}
.ui-oscuro{--surface:#0f1218;--surface-raised:#171b23;--ink:#e8ebf1;--ink-muted:#97a1b3;--line:#2a303c;--control-border:#8b95a7;--accent:#5cc3df;--on-accent:#0f1218;color-scheme:dark}
/* Propuesta CAL-397: tokens nuevos del tablero. El halo claro hace que anillos y puntos se vean sobre cualquier casilla; las flechas llevan su propio color, igual con la interfaz clara y oscura (su borde claro no cambia). */
:root{--board-halo:#ffffff;--arrow-best:#0a5f78;--arrow-yours:#1d2027}
.casilla img{position:relative;z-index:1;display:block;width:100%;height:100%}
.casilla[data-marks~="target"]:not([data-marks~="capture"])::after{inset:36%;border-radius:50%;background:var(--board-ink);opacity:1;box-shadow:0 0 0 2px var(--board-halo)}
.casilla[data-marks~="capture"]::after{inset:4%;border-radius:50%;border:4px solid var(--board-ink);opacity:1;box-shadow:0 0 0 2px var(--board-halo),inset 0 0 0 2px var(--board-halo)}
.casilla[data-marks~="check"]{background-image:radial-gradient(circle at 50% 50%,var(--mark-check) 0,transparent 72%);box-shadow:inset 0 0 0 3px var(--board-ink),inset 0 0 0 5px var(--board-halo)}
.casilla.foco{outline:3px solid var(--board-ink);outline-offset:-3px;box-shadow:inset 0 0 0 5px var(--board-halo);z-index:3}
.flecha--mejor{stroke:var(--arrow-best)}.flecha-punta--mejor{fill:var(--arrow-best)}
.flecha--tuya{stroke:var(--arrow-yours);opacity:.85}.flecha-punta--tuya{stroke:var(--arrow-yours);opacity:.85}
.fila-tema{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;padding:24px;border-radius:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.fila-tema h3{flex:1 1 100%;margin:0;font:600 20px/28px var(--font-display)}
.fila-tema figure{margin:0;display:flex;flex-direction:column;gap:8px}
.fila-tema figcaption{font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.muestra{position:absolute;left:12px;top:50%;margin-top:-10px;display:grid;grid-template-columns:repeat(2,10px);grid-template-rows:repeat(2,10px);border:1.5px solid var(--control-border)}
.muestra i{display:block;background:var(--square-light)}.muestra i:nth-child(2),.muestra i:nth-child(3){background:var(--square-dark)}
.tabla{border-collapse:collapse;width:100%;font:400 14px/20px var(--font-sans)}
.tabla th,.tabla td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tabla th{font-weight:600;color:var(--ink)}.tabla td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.nota-dis{margin:0;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
</style>
